<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tặng Cậu(. ❛ ᴗ ❛.) </title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css.css">
</head>
<body>

    <div id="webgl-container"></div>

    <!-- Màn hình mở cửa -->
    <div class="opening-door" id="openingDoor">
        <div class="door-half door-left"></div>
        <div class="door-half door-right"></div>
        <div class="door-seam"></div>
        <svg class="door-ornament" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="150" cy="150" r="120" fill="none" stroke="#f0b03c" stroke-width="6"/>
            <line x1="150" y1="30" x2="150" y2="270" stroke="#f0b03c" stroke-width="4"/>
            <line x1="30" y1="150" x2="270" y2="150" stroke="#f0b03c" stroke-width="4"/>
            <!-- viền thoi nối 4 cụm chính, tạo cảm giác đan xen như cửa sổ Trung Hoa -->
            <path d="M150,76 L224,150 L150,224 L76,150 Z" fill="none" stroke="#f0b03c" stroke-width="2.5" opacity="0.85"/>
            <!-- 4 cụm ô vuông lồng nhau ở 4 hướng chính -->
            <rect x="118" y="44" width="64" height="64" fill="none" stroke="#f0b03c" stroke-width="3"/>
            <rect x="135" y="61" width="30" height="30" fill="none" stroke="#f0b03c" stroke-width="2.5"/>
            <rect x="118" y="192" width="64" height="64" fill="none" stroke="#f0b03c" stroke-width="3"/>
            <rect x="135" y="209" width="30" height="30" fill="none" stroke="#f0b03c" stroke-width="2.5"/>
            <rect x="44" y="118" width="64" height="64" fill="none" stroke="#f0b03c" stroke-width="3"/>
            <rect x="61" y="135" width="30" height="30" fill="none" stroke="#f0b03c" stroke-width="2.5"/>
            <rect x="192" y="118" width="64" height="64" fill="none" stroke="#f0b03c" stroke-width="3"/>
            <rect x="209" y="135" width="30" height="30" fill="none" stroke="#f0b03c" stroke-width="2.5"/>
            <!-- 4 cụm ô vuông nhỏ ở 4 hướng chéo, cho dày họa tiết hơn -->
            <rect x="182" y="68" width="50" height="50" fill="none" stroke="#f0b03c" stroke-width="2.5"/>
            <rect x="196" y="82" width="22" height="22" fill="none" stroke="#f0b03c" stroke-width="2"/>
            <rect x="68" y="68" width="50" height="50" fill="none" stroke="#f0b03c" stroke-width="2.5"/>
            <rect x="82" y="82" width="22" height="22" fill="none" stroke="#f0b03c" stroke-width="2"/>
            <rect x="182" y="182" width="50" height="50" fill="none" stroke="#f0b03c" stroke-width="2.5"/>
            <rect x="196" y="196" width="22" height="22" fill="none" stroke="#f0b03c" stroke-width="2"/>
            <rect x="68" y="182" width="50" height="50" fill="none" stroke="#f0b03c" stroke-width="2.5"/>
            <rect x="82" y="196" width="22" height="22" fill="none" stroke="#f0b03c" stroke-width="2"/>
        </svg>
        <div class="door-lantern-hit" id="lanternHit" aria-label="Chạm vào lồng đèn">
            <div class="door-lantern-glow"></div>
            <img class="door-lantern" src="./assets/door-lantern-icon.png" alt="Lồng đèn đỏ">
        </div>
        <div class="door-hint">❃ CHẠM VÀO LỒNG ĐÈN ❃</div>
    </div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint">Chạm vào lồng đèn nhé</div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <h3 id="wishTitle">❁ Thông Điệp Trăng Rằm ❁</h3>
            
            <div class="wish-image-container">
                <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
            </div>

            <p id="wishText">"Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu."</p>
            <div class="tag">✦ Trung Thu An Lành ✦</div>
        </div>
    </div>

    <audio id="bgm" loop src="./assets/1.mp3"></audio>
    
    
    <!-- Three.js & OrbitControls -->
    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>
    <script>
        (function () {
            const door = document.getElementById("openingDoor");
            const lanternHit = document.getElementById("lanternHit");
            const bgm = document.getElementById("bgm");
            const audioBtn = document.getElementById("audio-btn");

            function openDoor() {
                if (lanternHit.classList.contains("tapped")) return;

                // phát nhạc ngay trong lúc xử lý chạm, để trình duyệt cho phép autoplay
                bgm.play()
                    .then(() => {
                        audioBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                    })
                    .catch(() => {
                        audioBtn.innerHTML = '<i class="fas fa-music" style="opacity:0.5;"></i>';
                    });

                // bước 1: lồng đèn biến mất
                lanternHit.classList.add("tapped");

                // bước 2: một nhịp sau, cửa mới mở
                setTimeout(() => door.classList.add("opened"), 380);
                setTimeout(() => door.remove(), 380 + 2600);
            }

            lanternHit.addEventListener("click", openDoor, { once: true });
        })();
    </script>
</body>
</html>
