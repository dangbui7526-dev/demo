<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tặng Cậu(. ❛ ᴗ ❛.) </title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css.css">
</head>
<body>

    <div id="webgl-container"></div>

    <!-- Màn hình mở cửa -->
    <div class="opening-door" id="openingDoor">
        <div class="door-half door-left"></div>
        <div class="door-half door-right"></div>
        <svg class="door-ornament" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            <circle cx="150" cy="150" r="128" fill="none" stroke="#ffd98a" stroke-width="5"/>
            <circle cx="150" cy="150" r="118" fill="none" stroke="#ffd98a" stroke-width="1.5" opacity="0.6"/>
            <circle cx="150" cy="150" r="108" fill="none" stroke="#ffd98a" stroke-width="1" opacity="0.35"/>
            <!-- trục chữ thập -->
            <line x1="150" y1="22" x2="150" y2="278" stroke="#ffd98a" stroke-width="4"/>
            <line x1="22" y1="150" x2="278" y2="150" stroke="#ffd98a" stroke-width="4"/>
            <!-- ô vuông 4 hướng chính -->
            <rect x="105" y="55" width="90" height="38" fill="none" stroke="#ffd98a" stroke-width="3"/>
            <rect x="105" y="207" width="90" height="38" fill="none" stroke="#ffd98a" stroke-width="3"/>
            <rect x="55" y="105" width="38" height="90" fill="none" stroke="#ffd98a" stroke-width="3"/>
            <rect x="207" y="105" width="38" height="90" fill="none" stroke="#ffd98a" stroke-width="3"/>
            <!-- trục chéo -->
            <line x1="58" y1="58" x2="242" y2="242" stroke="#ffd98a" stroke-width="1.5" opacity="0.5"/>
            <line x1="242" y1="58" x2="58" y2="242" stroke="#ffd98a" stroke-width="1.5" opacity="0.5"/>
            <!-- ô vuông nhỏ 4 góc chéo -->
            <rect x="72" y="72" width="20" height="20" fill="none" stroke="#ffd98a" stroke-width="2" transform="rotate(45 82 82)"/>
            <rect x="208" y="72" width="20" height="20" fill="none" stroke="#ffd98a" stroke-width="2" transform="rotate(45 218 82)"/>
            <rect x="72" y="208" width="20" height="20" fill="none" stroke="#ffd98a" stroke-width="2" transform="rotate(45 82 218)"/>
            <rect x="208" y="208" width="20" height="20" fill="none" stroke="#ffd98a" stroke-width="2" transform="rotate(45 218 218)"/>
            <!-- các đường tia ngoài vòng tròn -->
            <g stroke="#ffd98a" stroke-width="3" opacity="0.85">
                <line x1="150" y1="8" x2="150" y2="20"/>
                <line x1="150" y1="280" x2="150" y2="292"/>
                <line x1="8" y1="150" x2="20" y2="150"/>
                <line x1="280" y1="150" x2="292" y2="150"/>
                <line x1="41" y1="41" x2="49" y2="49"/>
                <line x1="251" y1="41" x2="259" y2="49"/>
                <line x1="41" y1="259" x2="49" y2="251"/>
                <line x1="251" y1="259" x2="259" y2="251"/>
            </g>
            <!-- chấm tròn nhỏ trang trí trên vòng -->
            <g fill="#ffd98a">
                <circle cx="150" cy="22" r="4"/>
                <circle cx="150" cy="278" r="4"/>
                <circle cx="22" cy="150" r="4"/>
                <circle cx="278" cy="150" r="4"/>
            </g>
        </svg>
        <svg class="door-lantern" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
            <line x1="50" y1="0" x2="50" y2="22" stroke="#ffd98a" stroke-width="2"/>
            <rect x="30" y="22" width="40" height="12" rx="2" fill="#ffd98a"/>
            <path d="M32 34 Q20 75 32 108 Q50 122 68 108 Q80 75 68 34 Z" fill="#e23b34" stroke="#ffd98a" stroke-width="2"/>
            <line x1="32" y1="52" x2="68" y2="52" stroke="#ffd98a" stroke-width="1.2" opacity="0.7"/>
            <line x1="30" y1="71" x2="70" y2="71" stroke="#ffd98a" stroke-width="1.2" opacity="0.7"/>
            <line x1="32" y1="90" x2="68" y2="90" stroke="#ffd98a" stroke-width="1.2" opacity="0.7"/>
            <rect x="30" y="108" width="40" height="12" rx="2" fill="#ffd98a"/>
            <line x1="50" y1="120" x2="50" y2="134" stroke="#ffd98a" stroke-width="2"/>
            <circle cx="50" cy="138" r="2.5" fill="#ffd98a"/>
        </svg>
        <div class="door-hint">CHẠM ĐỂ MỞ</div>
    </div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint">Chạm vào lồng đèn nhé</div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <h3 id="wishTitle">❁ Thông Điệp Trăng Rằm ❁</h3>
            
            <div class="wish-image-container">
                <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
            </div>

            <p id="wishText">"Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu."</p>
            <div class="tag">✦ Trung Thu An Lành ✦</div>
        </div>
    </div>

    <audio id="bgm" loop src="./assets/1.mp3"></audio>
    
    
    <!-- Three.js & OrbitControls -->
    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>
    <script>
        (function () {
            const door = document.getElementById("openingDoor");
            const bgm = document.getElementById("bgm");
            const audioBtn = document.getElementById("audio-btn");

            function openDoor() {
                if (door.classList.contains("opened")) return;
                door.classList.add("opened");
                bgm.play()
                    .then(() => {
                        audioBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                    })
                    .catch(() => {
                        audioBtn.innerHTML = '<i class="fas fa-music" style="opacity:0.5;"></i>';
                    });
                setTimeout(() => door.remove(), 2600);
            }

            door.addEventListener("click", openDoor, { once: true });
        })();
    </script>
</body>
</html>
