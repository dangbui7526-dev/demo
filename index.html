<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tặng Cậu(. ❛ ᴗ ❛.) </title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css.css">
</head>
<body>

    <div id="webgl-container"></div>

    <!-- Màn hình mở cửa -->
    <div class="opening-door" id="openingDoor">
        <div class="door-half door-left"></div>
        <div class="door-half door-right"></div>
        <div class="door-seam"></div>
        <svg class="door-ornament" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Hai vòng tròn vàng giống cổng trong ảnh mẫu -->
            <circle cx="160" cy="160" r="143" fill="none" stroke="#f6bd4d" stroke-width="3.5"/>
            <circle cx="160" cy="160" r="137" fill="none" stroke="#f6bd4d" stroke-width="2" opacity="0.95"/>

            <!-- Đường ngang chính -->
            <line x1="18" y1="160" x2="302" y2="160" stroke="#f6bd4d" stroke-width="2.2"/>

            <!-- Khung dọc trung tâm -->
            <rect x="112" y="30" width="96" height="260" fill="none" stroke="#f6bd4d" stroke-width="2.1"/>
            <rect x="132" y="53" width="56" height="214" fill="none" stroke="#f6bd4d" stroke-width="2.1"/>

            <!-- Các đường ngang bên trên -->
            <line x1="72" y1="82" x2="248" y2="82" stroke="#f6bd4d" stroke-width="2"/>
            <line x1="55" y1="111" x2="265" y2="111" stroke="#f6bd4d" stroke-width="2"/>
            <line x1="42" y1="132" x2="278" y2="132" stroke="#f6bd4d" stroke-width="2"/>

            <!-- Các đường ngang bên dưới -->
            <line x1="42" y1="188" x2="278" y2="188" stroke="#f6bd4d" stroke-width="2"/>
            <line x1="55" y1="209" x2="265" y2="209" stroke="#f6bd4d" stroke-width="2"/>
            <line x1="72" y1="238" x2="248" y2="238" stroke="#f6bd4d" stroke-width="2"/>

            <!-- Cụm cửa sổ đối xứng hai bên -->
            <path d="M46 111 H94 V132 H75 V188 H94 V209 H46" fill="none" stroke="#f6bd4d" stroke-width="2"/>
            <path d="M274 111 H226 V132 H245 V188 H226 V209 H274" fill="none" stroke="#f6bd4d" stroke-width="2"/>

            <!-- Các ô vuông nhỏ sát vòng tròn -->
            <rect x="63" y="94" width="18" height="18" fill="none" stroke="#f6bd4d" stroke-width="1.8"/>
            <rect x="239" y="94" width="18" height="18" fill="none" stroke="#f6bd4d" stroke-width="1.8"/>
            <rect x="63" y="208" width="18" height="18" fill="none" stroke="#f6bd4d" stroke-width="1.8"/>
            <rect x="239" y="208" width="18" height="18" fill="none" stroke="#f6bd4d" stroke-width="1.8"/>

            <!-- Hai cụm ô vuông hai bên lồng đèn -->
            <rect x="80" y="139" width="36" height="42" fill="none" stroke="#f6bd4d" stroke-width="2"/>
            <rect x="88" y="147" width="20" height="26" fill="none" stroke="#f6bd4d" stroke-width="1.7"/>
            <rect x="204" y="139" width="36" height="42" fill="none" stroke="#f6bd4d" stroke-width="2"/>
            <rect x="212" y="147" width="20" height="26" fill="none" stroke="#f6bd4d" stroke-width="1.7"/>
        </svg>
        <div class="door-lantern-hit" id="lanternHit" aria-label="Chạm vào lồng đèn">
            <div class="door-lantern-glow"></div>
            <img class="door-lantern" src="./assets/door-lantern-icon.png" alt="Lồng đèn đỏ">
        </div>
        <div class="door-hint">❃ CHẠM VÀO LỒNG ĐÈN ❃</div>
    </div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint">Chạm vào lồng đèn nhé</div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <h3 id="wishTitle">❁ Thông Điệp Trăng Rằm ❁</h3>
            
            <div class="wish-image-container">
                <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
            </div>

            <p id="wishText">"Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu."</p>
            <div class="tag">✦ Trung Thu An Lành ✦</div>
        </div>
    </div>

    <audio id="bgm" loop src="./assets/1.mp3"></audio>
    
    
    <!-- Three.js & OrbitControls -->
    <script src="./assets/three.min.js"></script>
    <script src="./assets/OrbitControls.js"></script>
    <script src="./assets/script.js"></script>
    <script>
        (function () {
            const door = document.getElementById("openingDoor");
            const lanternHit = document.getElementById("lanternHit");
            const bgm = document.getElementById("bgm");
            const audioBtn = document.getElementById("audio-btn");

            function openDoor() {
                if (lanternHit.classList.contains("tapped")) return;

                // phát nhạc ngay trong lúc xử lý chạm, để trình duyệt cho phép autoplay
                bgm.play()
                    .then(() => {
                        audioBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                    })
                    .catch(() => {
                        audioBtn.innerHTML = '<i class="fas fa-music" style="opacity:0.5;"></i>';
                    });

                // bước 1: lồng đèn biến mất
                lanternHit.classList.add("tapped");

                // bước 2: một nhịp sau, cửa mới mở
                setTimeout(() => door.classList.add("opened"), 380);
                setTimeout(() => door.remove(), 380 + 2600);
            }

            lanternHit.addEventListener("click", openDoor, { once: true });
        })();
    </script>
</body>
</html>
